<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会议手册预览 · 最新版</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #012c63;
        --paper: #ffffff;
        --cyan: #1c5fc2;
        --khaki: #c8d8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--ink);
        color: var(--paper);
        font-family:
          Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial,
          sans-serif;
        margin: 0;
      }

      header {
        align-items: center;
        border-bottom: 1px solid rgba(255, 250, 240, 0.16);
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: space-between;
        padding: 22px clamp(20px, 5vw, 64px);
        position: sticky;
        top: 0;
        backdrop-filter: blur(16px);
        background: rgba(1, 44, 99, 0.88);
        z-index: 2;
      }

      a {
        color: inherit;
        font-weight: 760;
        text-decoration: none;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .actions a {
        border: 1px solid rgba(255, 250, 240, 0.24);
        padding: 10px 14px;
      }

      .actions a:last-child {
        background: var(--cyan);
        border-color: var(--cyan);
        color: var(--paper);
      }

      main {
        display: grid;
        gap: 28px;
        margin: 0 auto;
        max-width: 980px;
        padding: 38px 20px 72px;
      }

      h1 {
        font-size: clamp(34px, 7vw, 72px);
        letter-spacing: 0;
        line-height: 1;
        margin: 0 0 8px;
      }

      p {
        color: rgba(255, 250, 240, 0.68);
        line-height: 1.8;
        margin: 0;
      }

      figure {
        border: 1px solid rgba(255, 250, 240, 0.16);
        margin: 0;
        overflow: hidden;
      }

      figcaption {
        border-top: 1px solid rgba(255, 250, 240, 0.16);
        color: var(--khaki);
        font-size: 13px;
        font-weight: 800;
        padding: 12px 16px;
      }

      img {
        background: #f4f4f4;
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">返回会议网站</a>
      <div class="actions">
        <a href="/handbook-final/page-01.png">查看封面</a>
        <a href="/dalian-number-theory-arithmetic-geometry-handbook-final.pdf">打开最新版 PDF</a>
      </div>
    </header>
    <main>
      <section>
        <h1>会议手册预览 · 最新版</h1>
        <p>Dalian Number Theory and Arithmetic Geometry Conference · Aug 16-21, 2026</p>
      </section>
      <figure>
        <img src="/handbook-final/page-01.png" alt="会议手册封面" fetchpriority="high" />
        <figcaption>封面</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-02.png" alt="会议日程" loading="lazy" />
        <figcaption>会议日程</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-03.png" alt="8月17日报告信息" loading="lazy" />
        <figcaption>报告信息 · 8月17日</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-04.png" alt="8月17日至18日报告信息" loading="lazy" />
        <figcaption>报告信息 · 8月17日至18日</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-05.png" alt="8月18日至19日报告信息" loading="lazy" />
        <figcaption>报告信息 · 8月18日至19日</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-06.png" alt="8月19日至20日报告信息" loading="lazy" />
        <figcaption>报告信息 · 8月19日至20日</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-07.png" alt="8月20日至21日报告信息" loading="lazy" />
        <figcaption>报告信息 · 8月20日至21日</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-08.png" alt="8月21日报告信息" loading="lazy" />
        <figcaption>报告信息 · 8月21日</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-09.png" alt="交通指南" loading="lazy" />
        <figcaption>交通指南</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-10.png" alt="大连理工大学凌水主校区校园地图" loading="lazy" />
        <figcaption>校园地图与校内步行路线</figcaption>
      </figure>
      <figure>
        <img src="/handbook-final/page-11.png" alt="大连理工大学数学科学学院简介" loading="lazy" />
        <figcaption>大连理工大学数学科学学院简介</figcaption>
      </figure>
    </main>
  </body>
</html>
